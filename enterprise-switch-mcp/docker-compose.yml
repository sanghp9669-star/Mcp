services:
  nginx-lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mcp-server-1
      - mcp-server-2
    networks:
      - netops-mesh

  mcp-server-1:
    build: .
    env_file: .env
    environment:
      APP_PORT: "8080"
      POSTGRES_DSN: "postgresql+asyncpg://mcp_app:mcp_secret@postgres-primary:5432/switch_mcp"
      POSTGRES_READ_DSN: "postgresql+asyncpg://mcp_app:mcp_secret@postgres-replica:5432/switch_mcp"
      REDIS_MODE: "sentinel"
      REDIS_SENTINEL_NODES: "redis-sentinel-1:26379"
      REDIS_SENTINEL_MASTER: "mymaster"
      RABBITMQ_URL: "amqp://mcp_user:rmq_secret@rabbitmq-1:5672/"
      VAULT_ADDR: "http://vault:8200"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_started
      rabbitmq-1:
        condition: service_healthy
    networks:
      - netops-mesh

  mcp-server-2:
    build: .
    env_file: .env
    environment:
      APP_PORT: "8080"
      POSTGRES_DSN: "postgresql+asyncpg://mcp_app:mcp_secret@postgres-primary:5432/switch_mcp"
      POSTGRES_READ_DSN: "postgresql+asyncpg://mcp_app:mcp_secret@postgres-replica:5432/switch_mcp"
      REDIS_MODE: "sentinel"
      REDIS_SENTINEL_NODES: "redis-sentinel-1:26379"
      REDIS_SENTINEL_MASTER: "mymaster"
      RABBITMQ_URL: "amqp://mcp_user:rmq_secret@rabbitmq-1:5672/"
      VAULT_ADDR: "http://vault:8200"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - netops-mesh

  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mcp_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_secret}
      POSTGRES_DB: switch_mcp
    volumes:
      - ./src/switch_mcp/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pg_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_app -d switch_mcp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netops-mesh

  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mcp_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_secret}
      POSTGRES_DB: switch_mcp
    networks:
      - netops-mesh

  redis-master:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - netops-mesh

  redis-sentinel-1:
    image: redis:7.4-alpine
    command: >
      sh -c "printf 'port 26379\nsentinel monitor mymaster redis-master 6379 1\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\n' > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-master
    networks:
      - netops-mesh

  rabbitmq-1:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mcp_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rmq_secret}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netops-mesh

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-only-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    networks:
      - netops-mesh

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
    networks:
      - netops-mesh

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - netops-mesh

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    networks:
      - netops-mesh

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - netops-mesh

volumes:
  pg_primary_data:

networks:
  netops-mesh:
    driver: bridge
