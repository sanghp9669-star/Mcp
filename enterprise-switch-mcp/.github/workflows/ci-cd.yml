name: Enterprise Switch MCP CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint & Typecheck
        run: |
          ruff check src tests
          mypy src
      - name: SAST Security Scan (Bandit)
        run: bandit -r src -ll
      - name: Run Unit & Security Tests
        run: pytest tests/unit tests/security -v --cov=switch_mcp

  build-and-deploy:
    needs: quality-and-security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/switch-mcp:${{ github.sha }}
      - name: Helm Lint
        run: helm lint ./deploy/helm/switch-mcp
