[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-switch-mcp"
version = "1.0.0"
description = "Enterprise Model Context Protocol (MCP) Server for Cisco Catalyst and Aruba Switches"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Principal Network Automation Architecture Team"}]
dependencies = [
  "mcp>=1.6.0",
  "fastmcp>=2.3.0",
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "netmiko>=4.5.0",
  "paramiko>=3.5.0",
  "napalm>=5.0.0",
  "asyncssh>=2.19.0",
  "textfsm>=1.1.3",
  "ttp>=0.9.5",
  "asyncpg>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "redis>=5.2.1",
  "aio-pika>=9.5.4",
  "hvac>=2.3.0",
  "pyjwt[crypto]>=2.10.1",
  "cryptography>=44.0.0",
  "pyotp>=2.9.0",
  "httpx>=0.28.1",
  "prometheus-client>=0.21.1",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.4",
  "mypy>=1.14.0",
  "bandit>=1.8.0",
  "locust>=2.32.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
