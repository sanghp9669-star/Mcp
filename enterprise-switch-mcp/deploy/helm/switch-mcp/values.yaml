replicaCount: 3

image:
  repository: ghcr.io/enterprise-netops/switch-mcp
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

env:
  APP_ENV: production
  MCP_TRANSPORT: streamable-http
  REDIS_MODE: sentinel
  SSH_STRICT_HOST_KEY_CHECKING: "true"
