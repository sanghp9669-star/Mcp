apiVersion: v1
kind: Namespace
metadata:
  name: netops-mcp
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: switch-mcp-config
  namespace: netops-mcp
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  MCP_TRANSPORT: "streamable-http"
  REDIS_MODE: "sentinel"
  REDIS_SENTINEL_MASTER: "mymaster"
  SSH_STRICT_HOST_KEY_CHECKING: "true"
  PROMETHEUS_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: switch-mcp-server
  namespace: netops-mcp
  labels:
    app: switch-mcp-server
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: switch-mcp-server
  template:
    metadata:
      labels:
        app: switch-mcp-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: switch-mcp
          image: ghcr.io/enterprise-netops/switch-mcp:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: switch-mcp-config
            - secretRef:
                name: switch-mcp-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: switch-mcp-service
  namespace: netops-mcp
spec:
  type: ClusterIP
  selector:
    app: switch-mcp-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: switch-mcp-hpa
  namespace: netops-mcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: switch-mcp-server
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: switch-mcp-pdb
  namespace: netops-mcp
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: switch-mcp-server
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: switch-mcp-netpol
  namespace: netops-mcp
spec:
  podSelector:
    matchLabels:
      app: switch-mcp-server
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 22
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 4317
